# Development override for docker-compose.yml
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# This enables live code reloading without rebuilding

version: '3.8'

services:
  api:
    volumes:
      # Only add the ui mount here (not already in docker-compose.yml)
      # Avoid re-declaring other mounts — duplicates strip the :Z SELinux flag
      - ./app/ui:/app/app/ui:Z
    # Disable file watching here because mounted Windows drives can reject watchfile access.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]